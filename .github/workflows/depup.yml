name: depup
on:
  schedule:
    - cron: "14 14 * * *" # Runs at 14:14 UTC every day
  repository_dispatch:
    types: [depup]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-depup/with-pr@a03fa2103b273193becba8cca43a992b9173f5dc # v1.6.7
        with:
          file: action.yml
          version_name: reviewdog_version
          repo: reviewdog/reviewdog
          labels: "bump:minor"
